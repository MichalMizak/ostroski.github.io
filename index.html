<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Official website of Spevácka skupina Ostroški, a folk music group from Slovakia.">
    <title>Spevácka skupina Ostroški</title>
    <link rel="stylesheet" href="styles.css">
    <script async src="https://tally.so/widgets/embed.js"></script>
</head>

<body>
    <header>
        <div class="container header-content">
            <img src="images/profile.jpg" alt="Spevácka skupina Ostroški Profile Photo" class="profile-photo">
            <h1>Spevácka skupina Ostroški</h1>
            <p>Folklórna skupina zo Sobranecka</p>
        </div>
    </header>

    <main>
        <section id="spotify" class="container">
            <div class="spotify-embed">
                <iframe data-testid="embed-iframe" style="border-radius:12px"
                    src="https://open.spotify.com/embed/artist/2Z5JbWBkMfXVo262PdVGK5?utm_source=generator&theme=0"
                    width="100%" height="352" frameborder="0" allowfullscreen
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy">
                </iframe>
            </div>
        </section>
        <section id="albums-link" class="container">
            <h2>Albumy</h2>
            <p>Máme ich tri, pozrite sa na nich bližšie.</p>
            <a class="button-link" href="albumy.html">💿 Prezrieť albumy</a>
        </section>
        <section id="videos" class="container">
            <h2>Videá</h2>
            <div class="video-grid">
                <figure class="video-item video-featured">
                    <div class="video-frame">
                        <iframe src="https://www.youtube-nocookie.com/embed/9UH-bLsERMo"
                            title="Pozvánka na koncert Novina z ňebeskoho dvora 21. 11. 2026" loading="lazy"
                            allowfullscreen referrerpolicy="strict-origin-when-cross-origin"
                            allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"></iframe>
                    </div>
                    <figcaption>Pozvánka na koncert Novina z ňebeskoho dvora – 21. 11. 2026</figcaption>
                </figure>
                <figure class="video-item">
                    <div class="video-frame">
                        <iframe src="https://www.youtube-nocookie.com/embed/85S2YMyAN5Q"
                            title="Oficiálne video Speváckej skupiny Ostroški" loading="lazy" allowfullscreen
                            referrerpolicy="strict-origin-when-cross-origin"
                            allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"></iframe>
                    </div>
                    <figcaption>Sama ja pasuľku sadzila, Ňit ľepši na śvece (Official video)</figcaption>
                </figure>
                <figure class="video-item">
                    <div class="video-frame">
                        <iframe src="https://www.youtube-nocookie.com/embed/8zAnqYMQ9qM"
                            title="Staršie vianočné video Speváckej skupiny Ostroški" loading="lazy" allowfullscreen
                            referrerpolicy="strict-origin-when-cross-origin"
                            allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"></iframe>
                    </div>
                    <figcaption>My pribuli, hospodarju (Official video)</figcaption>
                </figure>
            </div>
        </section>
        <section id="contact" class="container">
            <h2>Kontakt</h2>
            <ul>
                <li>Email: <a href="mailto:ssostroski@gmail.com">ssostroski@gmail.com</a></li>
                <li>Telefón: +421 918 983 516</li>
                <li><a href="https://facebook.com/ssostroski" target="_blank">Facebook </a>
                    <a href="https://instagram.com/ss_ostroski" target="_blank">Instagram</a>
                </li>
                <li><a href="https://tiktok.com/@ssostroski" target="_blank">TikTok </a>
                    <a href="https://youtube.com/c/spevackaskupinaostroski" target="_blank">YouTube</a>
                </li>
            </ul>
            <button class="tally-button" aria-label="Objednať CD" title="Objednať CD" data-tally-open="OQlZyM"
                data-tally-width="470" data-tally-overlay="1" data-tally-emoji-text="💿"
                data-tally-emoji-animation="tada">💿</button>
        </section>

    </main>

    <footer>
        <div class="container">
            <img src="images/logo.png" alt="Ostroški logo" class="logo">

        </div>
    </footer>
</body>

</html>
