<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interaktívny spevník - Spevácka skupina Ostroški.">
    <title>Spevník | Ostroški</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .ebook-header-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        #ebook {
            padding: 15px;
        }

        .ebook-toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .ebook-toolbar button {
            padding: 8px 16px;
            background: var(--accent-red);
            color: #fff;
            border: none;
            border-radius: 999px;
            font-family: inherit;
            font-size: 1em;
            font-weight: 400;
            cursor: pointer;
        }

        .ebook-toolbar button:hover:not(:disabled) {
            background: var(--accent-dark);
            text-decoration: none;
        }

        .ebook-toolbar button:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .ebook-toolbar button:focus-visible,
        .ebook-toolbar input:focus-visible {
            outline: 2px solid var(--accent-blue);
            outline-offset: 2px;
        }

        .page-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .page-indicator input {
            width: 3.5em;
            padding: 6px;
            font-family: inherit;
            font-size: 1em;
            text-align: center;
            border: 1px solid var(--accent-taupe);
            border-radius: 8px;
        }

        .ebook-layout {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 12px;
            align-items: start;
        }

        .ebook-thumbs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 75vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .thumb {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            align-items: center;
            padding: 4px;
            background: none;
            border: 2px solid transparent;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.8em;
            cursor: pointer;
            color: #333;
            min-height: 60px;
        }

        .thumb canvas {
            flex-shrink: 0;
            width: 100%;
            height: auto;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        .thumb.active {
            border-color: var(--accent-red);
        }

        .ebook-stage {
            background: var(--accent-dark);
            border-radius: 12px;
            padding: 10px;
            min-height: 300px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: auto;
            max-height: 80vh;
        }

        #page-canvas {
            display: block;
            background: #fff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            transition: opacity 0.15s ease;
        }

        #page-canvas.loading {
            opacity: 0.4;
        }

        .ebook-status {
            margin-top: 10px;
            font-size: 0.95em;
            opacity: 0.8;
        }

        .ebook-error {
            color: var(--accent-red);
            font-weight: 700;
        }

        @media (max-width: 700px) {
            .ebook-layout {
                grid-template-columns: 1fr;
            }

            .ebook-thumbs {
                flex-direction: row;
                max-height: none;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 0 0 6px;
                order: 2;
            }

            .thumb {
                flex: 0 0 80px;
            }
        }
    </style>
</head>

<body>
    <header class="page-header">
        <div class="container header-content">
            <h1>Spevník</h1>
            <p id="album-title"></p>
            <div class="ebook-header-links">
                <a class="back-link" href="index.html">&larr; Domov</a>
                <a class="back-link" href="albumy.html#album-2">💿 Album Dobre ženom</a>
            </div>
        </div>
    </header>

    <main>
        <section id="ebook" class="container">
            <div class="ebook-toolbar" role="toolbar" aria-label="Ovládanie spevníka">
                <button type="button" id="btn-first" aria-label="Prvá strana">&laquo;</button>
                <button type="button" id="btn-prev" aria-label="Predchádzajúca strana">&lsaquo; Späť</button>
                <span class="page-indicator">
                    <label for="page-input">Strana</label>
                    <input type="number" id="page-input" min="1" value="1" inputmode="numeric">
                    <span>/ <span id="page-count">–</span></span>
                </span>
                <button type="button" id="btn-next" aria-label="Nasledujúca strana">Ďalej &rsaquo;</button>
                <button type="button" id="btn-last" aria-label="Posledná strana">&raquo;</button>
                <button type="button" id="btn-zoom-out" aria-label="Oddialiť">&minus;</button>
                <button type="button" id="btn-zoom-in" aria-label="Priblížiť">+</button>
                <button type="button" id="btn-fit" aria-label="Obnoviť priblíženie" title="Obnoviť priblíženie">&#8635;</button>
            </div>

            <div class="ebook-layout">
                <nav class="ebook-thumbs" id="thumbs" aria-label="Miniatúry strán"></nav>
                <div class="ebook-stage" id="stage">
                    <canvas id="page-canvas" aria-label="Strana spevníka"></canvas>
                </div>
            </div>
            <p class="ebook-status" id="status" role="status" aria-live="polite">Načítavam spevník…</p>
            <p class="ebook-status">Listovať môžete aj šípkami na klávesnici (&larr; &rarr;).</p>
        </section>
    </main>

    <footer>
        <div class="container">
            <img src="images/logo.png" alt="Ostroški logo" class="logo">
        </div>
    </footer>

    <script type="module">
        import * as pdfjsLib from './vendor/pdfjs/pdf.min.mjs';

        pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.mjs';

        // Songbooks selectable via spevnik.html?album=<key>. Only keys listed here are accepted.
        const SONGBOOKS = {
            // hide: original view numbers (1-based, halves counted separately) to skip, e.g. blank pages
            'dobre-zenom': { title: 'Dobre ženom', pdf: 'pdf/Spevnik_dobre_zenom.pdf', hide: [2, 23] },
            'novina': { title: 'Novina z ňebeskoho dvora', pdf: 'pdf/Spevnik_novina_z_nebeskoho_dvora.pdf' }
        };
        const albumKey = new URLSearchParams(location.search).get('album');
        const songbook = Object.hasOwn(SONGBOOKS, albumKey) ? SONGBOOKS[albumKey] : null;

        const canvas = document.getElementById('page-canvas');
        const stage = document.getElementById('stage');
        const thumbs = document.getElementById('thumbs');
        const status = document.getElementById('status');
        const pageInput = document.getElementById('page-input');
        const pageCount = document.getElementById('page-count');
        const btn = id => document.getElementById(id);

        let pdf = null;
        let views = []; // { pageNum, half: null | 0 | 1, w, h } - w/h in PDF units at scale 1
        let current = 1; // 1-based index into views
        let zoom = 1; // multiplier on top of "fit to width"
        let renderTask = null;
        let renderToken = 0;

        // Spreads (landscape pages) are shown as two halves; the first and last page stay whole.
        // Views listed in `hide` are dropped, so the remaining views are renumbered continuously.
        async function buildViews(hide = []) {
            views = [];
            for (let n = 1; n <= pdf.numPages; n++) {
                const base = (await pdf.getPage(n)).getViewport({ scale: 1 });
                const split = n > 1 && n < pdf.numPages && base.width > base.height;
                if (split) {
                    views.push({ pageNum: n, half: 0, w: base.width / 2, h: base.height });
                    views.push({ pageNum: n, half: 1, w: base.width / 2, h: base.height });
                } else {
                    views.push({ pageNum: n, half: null, w: base.width, h: base.height });
                }
            }
            views = views.filter((_, i) => !hide.includes(i + 1));
        }

        // Render one view into the given canvas at the given scale (device pixels per PDF unit).
        function renderView(view, page, targetCanvas, scale) {
            const viewport = page.getViewport({
                scale,
                offsetX: view.half === 1 ? -view.w * scale : 0
            });
            targetCanvas.width = Math.floor(view.w * scale);
            targetCanvas.height = Math.floor(view.h * scale);
            return page.render({ canvas: targetCanvas, canvasContext: targetCanvas.getContext('2d'), viewport });
        }

        function fitScale(view) {
            const available = Math.max(stage.clientWidth - 20, 200);
            return (available / view.w) * zoom;
        }

        async function renderPage() {
            const token = ++renderToken;
            if (renderTask) renderTask.cancel();
            canvas.classList.add('loading');
            const view = views[current - 1];
            const page = await pdf.getPage(view.pageNum);
            if (token !== renderToken) return;

            const scale = fitScale(view);
            const dpr = window.devicePixelRatio || 1;
            renderTask = renderView(view, page, canvas, scale * dpr);
            canvas.style.width = Math.floor(view.w * scale) + 'px';
            canvas.style.height = Math.floor(view.h * scale) + 'px';
            try {
                await renderTask.promise;
                if (token === renderToken) canvas.classList.remove('loading');
            } catch (e) {
                if (e?.name !== 'RenderingCancelledException') showError();
            }
        }

        function updateUi() {
            pageInput.value = current;
            btn('btn-first').disabled = btn('btn-prev').disabled = current <= 1;
            btn('btn-next').disabled = btn('btn-last').disabled = current >= views.length;
            thumbs.querySelectorAll('.thumb').forEach((t, i) => {
                const active = i + 1 === current;
                t.classList.toggle('active', active);
                if (active) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
            });
            const active = thumbs.querySelector('.thumb.active');
            if (active) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
            history.replaceState(null, '', '#strana-' + current);
        }

        function goTo(n) {
            n = Math.min(Math.max(parseInt(n, 10) || 1, 1), views.length);
            current = n;
            updateUi();
            renderPage();
        }

        function showError() {
            status.textContent = 'Spevník sa nepodarilo načítať. Skúste stránku obnoviť.';
            status.classList.add('ebook-error');
        }

        // One thumbnail per view (half page); each canvas gets the view's full height.
        async function buildThumbnails() {
            const observer = new IntersectionObserver(async entries => {
                for (const entry of entries) {
                    if (!entry.isIntersecting) continue;
                    observer.unobserve(entry.target);
                    const view = views[Number(entry.target.dataset.page) - 1];
                    const page = await pdf.getPage(view.pageNum);
                    const c = entry.target.querySelector('canvas');
                    await renderView(view, page, c, 140 / view.w).promise;
                }
            }, { root: null, rootMargin: '200px' });

            for (let i = 1; i <= views.length; i++) {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'thumb';
                b.dataset.page = i;
                b.setAttribute('aria-label', 'Prejsť na stranu ' + i);
                const c = document.createElement('canvas');
                c.style.aspectRatio = views[i - 1].w + ' / ' + views[i - 1].h;
                b.append(c, document.createTextNode(String(i)));
                b.addEventListener('click', () => goTo(i));
                thumbs.append(b);
                observer.observe(b);
            }
        }

        function initialPage() {
            const m = /^#strana-(\d+)$/.exec(location.hash);
            return m ? Number(m[1]) : 1;
        }

        btn('btn-first').addEventListener('click', () => goTo(1));
        btn('btn-prev').addEventListener('click', () => goTo(current - 1));
        btn('btn-next').addEventListener('click', () => goTo(current + 1));
        btn('btn-last').addEventListener('click', () => goTo(views.length));
        btn('btn-zoom-in').addEventListener('click', () => { zoom = Math.min(zoom + 0.25, 3); renderPage(); });
        btn('btn-zoom-out').addEventListener('click', () => { zoom = Math.max(zoom - 0.25, 0.5); renderPage(); });
        btn('btn-fit').addEventListener('click', () => { zoom = 1; renderPage(); });
        pageInput.addEventListener('change', () => goTo(pageInput.value));
        document.addEventListener('keydown', e => {
            if (!pdf || e.target === pageInput) return;
            if (e.key === 'ArrowRight') goTo(current + 1);
            if (e.key === 'ArrowLeft') goTo(current - 1);
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => pdf && renderPage(), 150);
        });

        if (!songbook) {
            status.textContent = 'Spevník sa nenašiel. Vyberte si ho na stránke albumov.';
            status.classList.add('ebook-error');
        } else try {
            document.getElementById('album-title').textContent = songbook.title;
            document.title = 'Spevník | ' + songbook.title + ' | Ostroški';
            pdf = await pdfjsLib.getDocument({ url: songbook.pdf, standardFontDataUrl: './vendor/pdfjs/standard_fonts/' }).promise;
            await buildViews(songbook.hide);
            pageCount.textContent = views.length;
            pageInput.max = views.length;
            status.textContent = '';
            await buildThumbnails();
            goTo(initialPage());
        } catch (e) {
            showError();
        }
    </script>
</body>

</html>
